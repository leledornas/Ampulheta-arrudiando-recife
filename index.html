<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Arrudiando Recife – Ampulheta</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8E7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arrudiando Recife">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8E7;
    --navy: #17405A;
    --navy-dark: #0F2C40;
    --coral: #F05D4D;
    --sun: #F9BC27;
    --teal: #5BC0C8;
    --muted: #6E8590;
    --bg: #D8E8E4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--navy);
    display: flex;
    justify-content: center;
    align-items: center;
    overscroll-behavior: none;
  }

  /* ---------- App (mobile first: ocupa a tela toda) ---------- */
  .app {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    background-color: var(--cream);
    background-image: radial-gradient(rgba(23,64,90,.07) 1.2px, transparent 1.2px);
    background-size: 22px 22px;
    display: flex;
    flex-direction: column;
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(46px + env(safe-area-inset-bottom));
    overflow: hidden;
  }

  /* Moldura de celular só no desktop */
  @media (min-width: 600px) and (min-height: 720px) {
    body { padding: 24px; }
    .app {
      width: 400px;
      height: min(860px, calc(100dvh - 48px));
      border: 12px solid #fff;
      border-radius: 48px;
      box-shadow: 0 30px 60px rgba(23,64,90,.2);
      padding: 18px 18px 46px;
    }
  }

  /* ---------- Cabeçalho ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .icon-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 2px solid #E5E2DA;
    background: #fff;
    color: var(--navy);
    display: grid; place-items: center;
    cursor: pointer;
    flex: none;
    transition: transform .12s;
  }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 22px; height: 22px; }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 13px; letter-spacing: .18em;
    text-transform: uppercase;
  }
  .brand svg { width: 26px; height: 26px; }
  .header-spacer { width: 48px; height: 48px; flex: none; }

  /* ---------- Status / título ---------- */
  .status { text-align: center; margin-top: 14px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 14px;
    border-radius: 99px;
    font-size: 11px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase;
    border: 1.5px solid;
    transition: all .25s;
  }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.idle    { color: #2B8791; background: #E3F4F5; border-color: #B8E1E5; }
  .pill.running { color: #B9810A; background: #FEF1CC; border-color: #F7DC8C; }
  .pill.running i { animation: blink 1s infinite; }
  .pill.done    { color: #C23B2C; background: #FDE4E0; border-color: #F8B8B0; }

  h1 {
    font-family: 'Anton', 'Archivo Narrow', Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(30px, 9vw, 40px);
    line-height: 1.05;
    letter-spacing: -.01em;
    margin-top: 12px;
    text-transform: none;
  }
  .sub { margin-top: 6px; font-size: 15px; color: var(--muted); }

  /* ---------- Ampulheta ---------- */
  .glass-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex; align-items: center; justify-content: center;
    margin-top: 6px;
  }
  svg.hourglass { height: 100%; max-height: 330px; width: auto; max-width: 100%; overflow: visible; }
  .rays { opacity: 0; transition: opacity .3s; }
  .done .rays { opacity: 1; animation: pulse .8s ease-in-out infinite alternate; }
  .stream { stroke-dasharray: 4 6; animation: flow .35s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -10; } }
  @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes shake {
    0%,100% { transform: rotate(0); }
    20% { transform: rotate(-6deg); } 40% { transform: rotate(6deg); }
    60% { transform: rotate(-4deg); } 80% { transform: rotate(4deg); }
  }
  .hourglass.alarm { animation: shake .5s ease-in-out 3; transform-origin: 50% 50%; }

  /* ---------- Tempo ---------- */
  .time {
    text-align: center;
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(56px, 18vw, 76px);
    letter-spacing: -.04em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
  }
  .time-label {
    text-align: center;
    font-size: 11px; font-weight: 700; letter-spacing: .2em;
    color: var(--muted); text-transform: uppercase;
    margin: 6px 0 14px;
  }

  /* ---------- Botão principal ---------- */
  .primary-control {
    width: 100%;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px;
    border: none;
    border-radius: 26px;
    background: var(--navy);
    color: #fff;
    font: 700 19px/1.1 'DM Sans', sans-serif;
    box-shadow: 0 7px 0 var(--navy-dark);
    cursor: pointer;
    transition: transform .1s, box-shadow .1s;
    text-align: left;
  }
  .primary-control:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--navy-dark); }
  .primary-control .dot {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--coral);
    display: grid; place-items: center; flex: none;
  }
  .primary-control .dot svg { width: 16px; height: 16px; }
  .primary-control.cancel { background: #fff; color: var(--navy); border: 2px solid var(--navy); box-shadow: 0 7px 0 #C9D3D8; }
  .primary-control.cancel:active { box-shadow: 0 2px 0 #C9D3D8; }

  /* ---------- Card faixa ---------- */
  .range-card {
    margin-top: 22px;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px;
    background: #fff;
    border: 1.5px solid #E8E4DA;
    border-radius: 22px;
  }
  .range-card .ico {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--sun);
    display: grid; place-items: center; flex: none;
  }
  .range-card .ico svg { width: 24px; height: 24px; }
  .range-card .txt { flex: 1; min-width: 0; }
  .range-card small { font-size: 10px; font-weight: 700; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
  .range-card strong { display: block; font-size: 18px; line-height: 1.2; }
  .badge {
    font-size: 10px; font-weight: 700; letter-spacing: .12em;
    background: #EFEFEF; color: #6B6B6B;
    padding: 8px 12px; border-radius: 99px; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 6px; flex: none;
  }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #9A9A9A; }

  /* ---------- Rodapé decorativo (régua + ondas do mar do Recife) ---------- */
  .footer-deco {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 40px; pointer-events: none;
  }
  .footer-deco svg { width: 100%; height: 100%; display: block; }

  @media (max-height: 700px) {
    .range-card { margin-top: 14px; padding: 8px 14px; }
    .time-label { margin-bottom: 10px; }
    h1 { margin-top: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<main class="app" id="app">
  <header>
    <span class="header-spacer" aria-hidden="true"></span>
    <div class="brand">
      <svg viewBox="0 0 28 28"><rect x="3" y="12" width="5" height="14" rx="2.5" fill="#5BC0C8" transform="rotate(12 5 19)"/><rect x="11" y="5" width="5" height="21" rx="2.5" fill="#F9BC27" transform="rotate(8 13 15)"/><rect x="19" y="9" width="5" height="17" rx="2.5" fill="#F05D4D" transform="rotate(6 21 17)"/></svg>
      Arrudiando Recife
    </div>
    <button class="icon-btn" id="soundBtn" aria-label="Ligar ou desligar o som" aria-pressed="true">
      <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5v5h4l5 4v-13l-5 4z"/>
        <g id="waves"><path d="M16.5 9a4 4 0 010 6"/><path d="M19 6.5a7.5 7.5 0 010 11"/></g>
        <path id="slash" d="M4 4l16 16" style="display:none"/>
      </svg>
    </button>
  </header>

  <section class="status" aria-live="polite">
    <span class="pill idle" id="pill"><i></i><span id="pillText">Pronto para jogar</span></span>
    <h1 id="title">Pronto pra girar?</h1>
    <p class="sub" id="sub">0 rodadas jogadas</p>
  </section>

  <div class="glass-wrap">
    <svg class="hourglass" id="glass" viewBox="0 0 200 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ampulheta">
      <defs>
        <clipPath id="glassClip">
          <path d="M56 24 C56 70 88 105 94 130 C88 155 56 190 56 236 L144 236 C144 190 112 155 106 130 C112 105 144 70 144 24 Z"/>
        </clipPath>
      </defs>

      <!-- raios -->
      <g class="rays" id="rays" stroke="#F9BC27" stroke-width="5" stroke-linecap="round">
        <line x1="100" y1="-6" x2="100" y2="10"/>
        <line x1="150" y1="2" x2="144" y2="16"/>
        <line x1="50" y1="2" x2="56" y2="16"/>
        <line x1="190" y1="60" x2="174" y2="66"/>
        <line x1="10" y1="60" x2="26" y2="66"/>
        <line x1="198" y1="130" x2="180" y2="130"/>
        <line x1="2" y1="130" x2="20" y2="130"/>
        <line x1="188" y1="190" x2="172" y2="184"/>
        <line x1="12" y1="190" x2="28" y2="184"/>
        <line x1="150" y1="256" x2="144" y2="242"/>
        <line x1="50" y1="256" x2="56" y2="242"/>
      </g>

      <!-- vidro -->
      <path d="M56 24 C56 70 88 105 94 130 C88 155 56 190 56 236 L144 236 C144 190 112 155 106 130 C112 105 144 70 144 24 Z" fill="#E6EFEA" opacity=".95"/>

      <!-- areia -->
      <g clip-path="url(#glassClip)">
        <rect id="topSand" x="40" y="36" width="120" height="94" fill="#F9BC27"/>
        <path id="botSand" d="" fill="#F9BC27" style="display:none"/>
        <line id="stream" class="stream" x1="100" y1="130" x2="100" y2="236" stroke="#F9BC27" stroke-width="3" stroke-linecap="round" style="display:none"/>
      </g>

      <!-- brilho -->
      <path d="M68 40 C70 68 82 88 90 106" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>

      <!-- contorno -->
      <path d="M56 24 C56 70 88 105 94 130 C88 155 56 190 56 236 L144 236 C144 190 112 155 106 130 C112 105 144 70 144 24 Z" fill="none" stroke="#17405A" stroke-width="6" stroke-linejoin="round"/>

      <!-- tampas -->
      <rect x="40" y="10" width="120" height="16" rx="8" fill="#F05D4D" stroke="#17405A" stroke-width="5"/>
      <rect x="40" y="234" width="120" height="16" rx="8" fill="#F05D4D" stroke="#17405A" stroke-width="5"/>
    </svg>
  </div>

  <div class="time" id="time">00:00</div>
  <div class="time-label" id="timeLabel">Aguardando início</div>

  <button class="primary-control" id="mainBtn">
    <span class="dot"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M4 2.5v11l9-5.5z"/></svg></span>
    <span id="mainBtnText">Começar partida</span>
  </button>

  <div class="range-card">
    <div class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="#17405A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="#17405A"/></svg>
    </div>
    <div class="txt">
      <small>Faixa da rodada</small>
      <strong><span id="rangeText">25–40</span> segundos</strong>
    </div>
    <span class="badge">Automática</span>
  </div>

  <div class="footer-deco" aria-hidden="true">
    <svg viewBox="0 0 400 40" preserveAspectRatio="none">
      <line x1="0" y1="8" x2="400" y2="8" stroke="#5BC0C8" stroke-width="2.5"/>
      <g stroke="#5BC0C8" stroke-width="2" id="ticks"></g>
      <path id="waves-deco" fill="none" stroke="#5BC0C8" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>
</main>

<script>
(() => {
  'use strict';

  /* ===== Configuração ===== */
  const MIN_SECONDS = 25;       // menor duração de uma rodada
  const MAX_SECONDS = 40;       // maior duração de uma rodada
  const ALARM_REPEATS = 4;      // quantas vezes o alarme toca antes de reiniciar
  const ALARM_GAP = 0.7;        // segundos entre um toque e o próximo
  // depois do último toque, a próxima rodada começa sozinha
  const ALARM_MS = Math.round(ALARM_REPEATS * ALARM_GAP * 1000) + 300;

  /* ===== Elementos ===== */
  const $ = (id) => document.getElementById(id);
  const el = {
    app: $('app'), glass: $('glass'),
    pill: $('pill'), pillText: $('pillText'), title: $('title'), sub: $('sub'),
    time: $('time'), timeLabel: $('timeLabel'),
    mainBtn: $('mainBtn'), mainBtnText: $('mainBtnText'),
    soundBtn: $('soundBtn'),
    slash: $('slash'), waves: $('waves'),
    topSand: $('topSand'), botSand: $('botSand'), stream: $('stream'),
    range: $('rangeText')
  };
  el.range.textContent = MIN_SECONDS + '–' + MAX_SECONDS;

  /* ===== Estado ===== */
  // idle    = esperando começar
  // running = ampulheta correndo (rodada em andamento)
  // alarm   = alarme tocando; ao terminar, a próxima rodada começa sozinha
  // ended   = jogador apertou "Finalizar partida"
  let state = 'idle';
  let rounds = 0;               // rodadas concluídas na partida atual
  let duration = 0;             // segundos da rodada atual (sorteado, fica escondido do jogador)
  let startedAt = 0;
  let raf = 0;
  let endTimeout = 0;
  let alarmTimeout = 0;
  let soundOn = true;
  let wakeLock = null;

  /* ===== Utilidades ===== */
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (s) => pad(Math.floor(s / 60)) + ':' + pad(Math.floor(s % 60));
  const randomDuration = () => MIN_SECONDS + Math.floor(Math.random() * (MAX_SECONDS - MIN_SECONDS + 1));
  const isActive = () => state === 'running' || state === 'alarm';

  function clearTimers() {
    cancelAnimationFrame(raf);
    clearTimeout(endTimeout);
    clearTimeout(alarmTimeout);
  }

  /* ===== Ampulheta (areia) ===== */
  function drawSand(p) {
    const topY = 36 + p * 94;                       // nível da areia de cima (36 → 130)
    el.topSand.setAttribute('y', topY);
    el.topSand.setAttribute('height', Math.max(0, 130 - topY));
    el.topSand.style.display = p >= 1 ? 'none' : '';

    const h = p * 84;                                // altura da areia de baixo
    if (h <= 0.5) {
      el.botSand.style.display = 'none';
    } else {
      const y = 236 - h;
      const peak = Math.min(14, h * 0.5);
      el.botSand.setAttribute('d',
        `M40 236 L40 ${y + peak} Q100 ${y - peak} 160 ${y + peak} L160 236 Z`);
      el.botSand.style.display = '';
    }

    const flowing = state === 'running' && p > 0 && p < 1;
    el.stream.style.display = flowing ? '' : 'none';
    if (flowing) el.stream.setAttribute('y2', 236 - h);
  }

  /* ===== Interface por estado ===== */
  function render() {
    const rt = rounds === 1 ? '1 rodada jogada' : rounds + ' rodadas jogadas';
    const finished = state === 'alarm' || state === 'ended';
    el.pill.className = 'pill ' + (finished ? 'done' : state);
    el.app.classList.toggle('done', finished);

    if (state === 'idle') {
      el.pillText.textContent = 'Pronto para jogar';
      el.title.textContent = 'Pronto pra girar?';
      el.sub.textContent = rt;
      el.timeLabel.textContent = 'Aguardando início';
      setMain('play', 'Começar partida', false);
    } else if (state === 'running') {
      el.pillText.textContent = 'Partida em andamento';
      el.title.textContent = 'O tempo está passando!';
      el.sub.textContent = 'Rodada ' + (rounds + 1) + ' · ninguém sabe quando acaba…';
      el.timeLabel.textContent = 'Tempo decorrido';
      setMain('stop', 'Finalizar partida', true);
    } else if (state === 'alarm') {
      el.pillText.textContent = 'Vez de girar a roleta!';
      el.title.textContent = 'O tempo acabou!';
      el.sub.textContent = 'Rodada ' + rounds + ' encerrada · a próxima já começa…';
      el.timeLabel.textContent = 'Tempo da rodada';
      setMain('stop', 'Finalizar partida', true);
    } else {
      el.pillText.textContent = 'Partida encerrada';
      el.title.textContent = 'O tempo está passando!';
      el.sub.textContent = rt;
      el.timeLabel.textContent = 'Partida finalizada';
      setMain('play', 'Começar nova partida', false);
    }
  }

  function setMain(icon, text, cancel) {
    el.mainBtnText.textContent = text;
    el.mainBtn.classList.toggle('cancel', cancel);
    const dot = el.mainBtn.querySelector('.dot');
    dot.style.background = cancel ? 'var(--navy)' : 'var(--coral)';
    dot.innerHTML = icon === 'play'
      ? '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M4 2.5v11l9-5.5z"/></svg>'
      : '<svg viewBox="0 0 16 16" fill="#fff"><rect x="3" y="3" width="10" height="10" rx="2"/></svg>';
  }

  /* ===== Fluxo da partida ===== */
  function startGame() {            // botão "Começar partida"
    unlockAudio();
    rounds = 0;
    startRound();
  }

  function startRound() {           // inicia (ou reinicia) a ampulheta com um novo tempo sorteado
    clearTimers();
    duration = randomDuration();
    startedAt = performance.now();
    state = 'running';
    el.glass.classList.remove('alarm');
    el.time.textContent = '00:00';
    drawSand(0);
    render();
    requestWakeLock();
    // segurança: se a aba ficar em segundo plano e o rAF pausar, o setTimeout ainda dispara
    endTimeout = setTimeout(() => { if (state === 'running') finishRound(); }, duration * 1000 + 30);
    raf = requestAnimationFrame(tick);
  }

  function tick() {
    if (state !== 'running') return;
    const elapsed = (performance.now() - startedAt) / 1000;
    if (elapsed >= duration) { finishRound(); return; }
    el.time.textContent = fmt(elapsed);
    drawSand(elapsed / duration);
    raf = requestAnimationFrame(tick);
  }

  function finishRound() {          // tempo acabou: toca o alarme e, depois dos toques, reinicia sozinho
    if (state !== 'running') return;
    cancelAnimationFrame(raf);
    clearTimeout(endTimeout);
    state = 'alarm';
    rounds++;
    el.time.textContent = fmt(duration);
    drawSand(1);
    render();
    el.glass.classList.remove('alarm');
    void el.glass.getBoundingClientRect();
    el.glass.classList.add('alarm');
    alarm();
    alarmTimeout = setTimeout(() => { if (state === 'alarm') startRound(); }, ALARM_MS);
  }

  function endGame() {              // botão "Finalizar partida"
    clearTimers();
    stopSounds();
    stopKeepAlive();
    state = 'ended';
    el.stream.style.display = 'none';
    el.glass.classList.remove('alarm');
    render();
    releaseWakeLock();
  }

  /* ===== Som (Web Audio – não precisa de arquivo de áudio) ===== */
  let ctx = null;
  const live = new Set();           // tons agendados/tocando, para poder parar ao finalizar
  function unlockAudio() {
    // iPhone: pede ao Safari para tratar o áudio como "reprodução de mídia",
    // o que faz o som tocar mesmo com a chave lateral no silencioso
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    startKeepAlive();
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) {}
  }

  // Plano B para iPhones/Safari mais antigos: um áudio mudo em loop durante a partida
  // mantém a sessão de áudio em modo "mídia", e o alarme passa a tocar no silencioso.
  let keepAlive = null;
  function silentWavUrl() {
    const rate = 8000, n = rate / 2;               // 0,5 s de silêncio
    const buf = new ArrayBuffer(44 + n);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate, true);
    v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    w(36, 'data'); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  function startKeepAlive() {
    try {
      if (!keepAlive) {
        keepAlive = new Audio(silentWavUrl());
        keepAlive.loop = true;
        keepAlive.setAttribute('playsinline', '');
      }
      const p = keepAlive.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
  function stopKeepAlive() {
    try { if (keepAlive) keepAlive.pause(); } catch (e) {}
  }
  function beep(freq, when, dur, type = 'square', vol = 0.35) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g).connect(ctx.destination);
    live.add(o);
    o.onended = () => live.delete(o);
    o.start(when);
    o.stop(when + dur + 0.05);
  }
  function stopSounds() {
    live.forEach((o) => { try { o.stop(); } catch (e) {} });
    live.clear();
    if (navigator.vibrate) navigator.vibrate(0);
  }
  function alarm() {
    if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 700]);
    if (!soundOn) return;
    unlockAudio();
    if (!ctx) return;
    const t0 = ctx.currentTime + 0.05;
    // ALARM_REPEATS "toques" de dois tons, bem audíveis
    for (let i = 0; i < ALARM_REPEATS; i++) {
      const t = t0 + i * ALARM_GAP;
      beep(880, t, 0.28);
      beep(1175, t + 0.3, 0.28);
    }
  }

  /* ===== Tela sempre ligada durante a partida ===== */
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) {}
  }
  function releaseWakeLock() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !isActive()) return;
    requestWakeLock();
    if (state === 'running' && (performance.now() - startedAt) / 1000 >= duration) finishRound();
  });

  /* ===== Eventos ===== */
  el.mainBtn.addEventListener('click', () => (isActive() ? endGame() : startGame()));
  el.soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    el.soundBtn.setAttribute('aria-pressed', String(soundOn));
    el.slash.style.display = soundOn ? 'none' : '';
    el.waves.style.display = soundOn ? '' : 'none';
    if (!soundOn) stopSounds();
    else { unlockAudio(); if (ctx) beep(988, ctx.currentTime + 0.02, 0.18, 'triangle', 0.3); }
  });

  /* ===== Decoração do rodapé ===== */
  (function deco() {
    const ticks = $('ticks');
    let d = '';
    for (let x = 12; x <= 400; x += 24) {
      const long = ((x - 12) / 24) % 3 === 0;
      d += `<line x1="${x}" y1="8" x2="${x}" y2="${long ? 20 : 15}"/>`;
    }
    ticks.innerHTML = d;
    let w = 'M0 30';
    for (let x = 0; x < 400; x += 20) w += ` q5 -6 10 0 t10 0`;
    $('waves-deco').setAttribute('d', w);
  })();

  /* ===== Início ===== */
  drawSand(0);
  render();
})();
</script>
</body>
</html>
